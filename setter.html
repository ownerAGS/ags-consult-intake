<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a1410">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AGS Profile">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://alphagentlemensuits.com/cdn/shop/files/logo_f9536896-d3d9-467b-9a93-4dd193670fce.jpg">
  <title>Your consultation profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #f4efe3;
      --gold: #c4a35a;
      --paper: #f7f1e4;
      --notch: 16px;
    }
    * { box-sizing: border-box; }
    html { background: #120e0a; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cormorant Garamond", Georgia, serif;
      color: #2c261c;
    }
    .scene-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #120e0a url("study-bg.jpg") center / cover no-repeat;
    }
    .scene-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10,7,5,0.38) 0%, rgba(10,7,5,0.58) 100%);
    }
    header, main, .conduct { position: relative; z-index: 1; }
    header {
      padding: 28px 20px 8px;
      text-align: center;
      color: var(--ivory);
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 18px 40px; }
    .eyebrow {
      font-family: Cinzel, "Playfair Display", serif;
      font-size: 11px;
      letter-spacing: 0.32em;
      color: #e8dcc4;
      margin: 0 0 10px;
      text-transform: uppercase;
    }
    .ornament { display: block; width: 92px; height: 14px; margin: 0 auto 14px; }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 500;
      font-style: italic;
      font-size: clamp(28px, 7vw, 40px);
      margin: 0 0 12px;
      color: #fff;
      line-height: 1.15;
    }
    header .sub {
      margin: 0 auto;
      max-width: 28em;
      color: #d9cdb4;
      font-size: 16px;
      font-style: italic;
    }
    main { padding: 18px 0 48px; }
    .parchment {
      background: var(--paper);
      padding: 22px 14px 10px;
      clip-path: polygon(
        var(--notch) 0, calc(100% - var(--notch)) 0,
        100% var(--notch), 100% calc(100% - var(--notch)),
        calc(100% - var(--notch)) 100%, var(--notch) 100%,
        0 calc(100% - var(--notch)), 0 var(--notch)
      );
      box-shadow:
        inset 0 0 0 1px rgba(196,163,90,0.55),
        0 28px 70px rgba(0,0,0,0.55);
    }
    .monogram {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 16px;
      padding: 0 8px;
    }
    .monogram::before,
    .monogram::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .monogram::after { background: linear-gradient(90deg, var(--gold), transparent); }
    .monogram img { height: 48px; width: auto; display: block; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 8px 14px;
    }
    .tab {
      font-family: Cinzel, serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 12px 8px;
      border: 1px solid #c4b48a;
      background: #ebe3d2;
      color: #16120e;
      cursor: pointer;
    }
    .tab.on {
      background: #16120e;
      color: var(--ivory);
      border-color: #16120e;
    }
    .frame-wrap { background: #fff; min-height: 1400px; }
    .frame-wrap[hidden] { display: none !important; }
    iframe {
      display: block;
      width: 100%;
      min-height: 2200px;
      border: 0;
      background: #fff;
    }
    .conduct {
      text-align: center;
      color: #c4b48a;
      font-style: italic;
      padding: 0 16px 40px;
    }
    footer {
      text-align: center;
      color: #c4b48a;
      font-size: 13px;
      padding-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="scene-bg" aria-hidden="true"></div>
  <header>
    <div class="wrap">
      <p class="eyebrow">Alpha Gentlemen Suits</p>
      <svg class="ornament" viewBox="0 0 120 14" aria-hidden="true">
        <path d="M4 7 H46" fill="none" stroke="#c4a35a" stroke-width="0.7"/>
        <path d="M74 7 H116" fill="none" stroke="#c4a35a" stroke-width="0.7"/>
        <path d="M60 1.5 L64 7 L60 12.5 L56 7 Z" fill="none" stroke="#c4a35a" stroke-width="0.8"/>
        <circle cx="60" cy="7" r="1.4" fill="#c4a35a"/>
      </svg>
      <h1>Finish your profile for Kyle</h1>
      <p class="sub">Use the same name, email, and phone already on the contact so Elite updates that file — not a new one.</p>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="parchment">
        <div class="monogram">
          <img src="logo-black.png" alt="Alpha Gentlemen Suits">
        </div>
        <div class="tabs">
          <button type="button" class="tab on" id="tabIn" data-form="in">In person</button>
          <button type="button" class="tab" id="tabVirt" data-form="virt">Virtual</button>
        </div>
        <div class="frame-wrap" id="wrapIn">
          <iframe
            src="https://api.leadconnectorhq.com/widget/form/GbqOqmv0GWcaxFVfWXH2"
            id="form-in"
            title="In-person consultation profile"
            data-layout-iframe-id="form-in"
            data-form-id="GbqOqmv0GWcaxFVfWXH2"></iframe>
        </div>
        <div class="frame-wrap" id="wrapVirt" hidden>
          <iframe
            src="https://api.leadconnectorhq.com/widget/form/p47RCE4b9VqsxG4dqDdE"
            id="form-virt"
            title="Virtual consultation profile"
            data-layout-iframe-id="form-virt"
            data-form-id="p47RCE4b9VqsxG4dqDdE"></iframe>
        </div>
      </div>
    </div>
  </main>
  <p class="conduct">Clothing changes conduct</p>
  <footer>Alpha Gentlemen Suits · Tampa</footer>
  <script src="https://link.msgsndr.com/js/form_embed.js"></script>
  <script>
    const tabIn = document.getElementById("tabIn");
    const tabVirt = document.getElementById("tabVirt");
    const wrapIn = document.getElementById("wrapIn");
    const wrapVirt = document.getElementById("wrapVirt");
    function show(which) {
      const inPerson = which === "in";
      tabIn.classList.toggle("on", inPerson);
      tabVirt.classList.toggle("on", !inPerson);
      wrapIn.hidden = !inPerson;
      wrapVirt.hidden = inPerson;
    }
    tabIn.addEventListener("click", function () { show("in"); });
    tabVirt.addEventListener("click", function () { show("virt"); });
  </script>
</body>
</html>
